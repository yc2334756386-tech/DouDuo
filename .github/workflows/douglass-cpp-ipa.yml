name: DouGlass C++ unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [codex/douglass-v07-refit]
    paths:
      - cpp-client/**
      - .github/workflows/douglass-cpp-ipa.yml

permissions:
  contents: read

jobs:
  rife-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export pinned RIFE Core ML model
        run: |
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install coremltools==9.0 safetensors==0.5.3
          mkdir -p build/rife
          python cpp-client/scripts/export-rife.py build/rife/RIFE425.mlpackage --weights build/rife/model.safetensors
          tar -C build/rife -czf build/rife/RIFE425.tar.gz RIFE425.mlpackage
      - uses: actions/upload-artifact@v4
        with:
          name: RIFE425-CoreML
          path: build/rife/RIFE425.tar.gz
          compression-level: 0
          retention-days: 1

  build:
    needs: rife-model
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RIFE425-CoreML
          path: build/rife
      - name: Compile C++ and package unsigned IPA
        run: |
          tar -C build/rife -xzf build/rife/RIFE425.tar.gz
          DG_RIFE_PACKAGE="$PWD/build/rife/RIFE425.mlpackage" bash cpp-client/scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DouGlass-0.20.27-unsigned-IPA
          path: |
            build/douglass/DouGlass-0.20.27-unsigned.ipa
            build/douglass/SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
