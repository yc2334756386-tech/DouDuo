name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify VLC
        run: sh scripts/fetch-vlckit.sh

      - name: Compile iPhoneOS release
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -project DouDuo.xcodeproj -scheme DouDuo -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$((129 + GITHUB_RUN_NUMBER))" build

      - name: Package and verify unsigned IPA
        run: python3 scripts/package_unsigned.py build/DerivedData/Build/Products/Release-iphoneos/DouDuo.app build/delivery

      - uses: actions/upload-artifact@v4
        with:
          name: DouDuo-unsigned-IPA
          path: build/delivery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
