name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Check search and collection responses
        run: |
          node scripts/test_library_actions.js
          node scripts/test_search_pages.js
          python3 scripts/test_personal_layout.py

      - name: Fetch and verify VLC
        run: sh scripts/fetch-vlckit.sh

      - name: Compile iPhoneOS release
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -project DouDuo.xcodeproj -scheme DouDuo -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$((129 + GITHUB_RUN_NUMBER))" build

      - name: Package and verify unsigned IPA
        run: python3 scripts/package_unsigned.py build/DerivedData/Build/Products/Release-iphoneos/DouDuo.app build/delivery

      - uses: actions/upload-artifact@v4
        with:
          name: DouDuo-unsigned-IPA
          path: build/delivery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  interface-check:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify VLC
        run: sh scripts/fetch-vlckit.sh
      - name: Check video and photo comment layout
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=[d for rows in json.load(sys.stdin)["devices"].values() for d in rows if "iPhone" in d["name"]]; devices.sort(key=lambda d: ("Duo" in d["name"], "Pro" not in d["name"])); print(devices[0]["udid"])')
          xcodebuild test -project DouDuo.xcodeproj -scheme DouDuo -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath build/Simulator \
            -resultBundlePath build/qa/UI.xcresult -parallel-testing-enabled NO \
            -only-testing:DouDuoUITests/DYPersonalLayoutTests CODE_SIGNING_ALLOWED=NO
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d build/qa/UI.xcresult ]; then
            xcrun xcresulttool export attachments --path build/qa/UI.xcresult --output-path build/qa/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DouDuo-interface-check
          path: build/qa/screenshots/
          if-no-files-found: warn
          retention-days: 14
